services:
  bot:
    build: .
    image: discord-ai-companion:usb-light
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/${DATABASE_FILENAME:-bot.sqlite3}
    volumes:
      - bot-data:/app/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    networks:
      - default
      - tool-control
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  mcp-web:
    build: ./mcp_web
    image: discord-mcp-web:usb-light
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 96
    networks:
      - tool-control
      - web-egress
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"


volumes:
  bot-data:

networks:
  tool-control:
    internal: true
  web-egress:
